<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增紀錄 - 長跑紀錄 v1.7.1</title>
    <style>
        /* 保持原本的漂亮樣式 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; color: #333; padding: 15px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { margin: 0; color: #2c3e50; }
        .btn-logout { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; }

        h3 { font-size: 1.1rem; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; margin-top: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }

        .summary-panel { background: linear-gradient(135deg, #3498db, #2980b9); color: white; padding: 15px; border-radius: 8px; display: flex; justify-content: space-around; margin-bottom: 20px; text-align: center; }
        .summary-item strong { display: block; font-size: 1.4rem; }
        
        .segment-list { display: flex; flex-direction: column; gap: 15px; }
        .segment-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; position: relative; border-left: 5px solid #ccc; }
        .type-easy { border-left-color: #2ecc71; }
        .type-tempo { border-left-color: #f39c12; }
        .type-interval { border-left-color: #e74c3c; }
        .type-strength { border-left-color: #8e44ad; }
        
        .btn-remove { background: none; border: none; color: #999; position: absolute; top: 10px; right: 10px; cursor: pointer; font-size: 1.2rem; }
        .btn-add-segment { width: 100%; border: 2px dashed #bdc3c7; background: #f9f9f9; color: #7f8c8d; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .btn-submit { width: 100%; padding: 14px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 1.1rem; cursor: pointer; margin-top: 30px; font-weight: bold; }
        .range-wrap { display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>🏃‍♂️ 訓練日誌</h2>
        <button onclick="handleLogout()" class="btn-logout">登出</button>
    </div>

    <form id="trainingForm">
        <div class="summary-panel">
            <div class="summary-item"><strong id="totalDist">0.00</strong><span>總公里 (km)</span></div>
            <div class="summary-item"><strong id="totalTime">0</strong><span>總時間 (min)</span></div>
        </div>

        <div class="form-group">
            <label>📅 日期與時間</label>
            <input type="datetime-local" id="trainingDate" required>
        </div>

        <h3>🧩 訓練組合</h3>
        <div id="segmentContainer" class="segment-list"></div>
        <button type="button" class="btn-add-segment" onclick="addSegment()">＋ 新增訓練分段</button>

        <h3>💧 補給與筆記</h3>
        <div class="form-group">
            <label>天氣</label>
            <select id="weather">
                <option value="cloudy">☁️ 多雲</option>
                <option value="sunny">☀️ 晴天</option>
                <option value="rainy">🌧️ 雨天</option>
            </select>
        </div>
        <div class="form-group">
            <label>筆記</label>
            <textarea rows="3"></textarea>
        </div>

        <button type="submit" class="btn-submit">💾 儲存紀錄 (上傳雲端)</button>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>

<script src="firebase-config.js"></script>

<script>
    // 檢查登入狀態：如果沒登入，踢回 login.html
    auth.onAuthStateChanged((user) => {
        if (!user) {
            alert("請先登入！");
            window.location.href = "login.html";
        } else {
            console.log("目前使用者:", user.email);
        }
    });

    function handleLogout() {
        auth.signOut().then(() => {
            alert("已登出");
            window.location.href = "login.html";
        });
    }

    // 初始化日期
    document.getElementById('trainingDate').value = new Date().toISOString().slice(0,16);

    const workoutTypes = {
        'easy': { color: 'type-easy' },
        'tempo': { color: 'type-tempo' },
        'interval': { color: 'type-interval' },
        'strength': { color: 'type-strength' }
    };

    function addSegment() {
        const id = Date.now();
        const html = `
            <div class="segment-card type-easy" id="seg-${id}">
                <button type="button" class="btn-remove" onclick="removeSegment('${id}')">×</button>
                <div class="form-group">
                    <label>類型</label>
                    <select onchange="updateSegmentType(this, '${id}')" class="segment-type-select">
                        <option value="easy">🟢 輕鬆跑</option>
                        <option value="tempo">🟠 節奏跑</option>
                        <option value="interval">🔴 間歇跑</option>
                        <option value="strength">🏋️ 肌力訓練</option>
                    </select>
                </div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1"><label>距離</label><input type="number" step="0.01" class="input-dist" placeholder="0" oninput="calculateTotals()"></div>
                    <div style="flex:1"><label>時間</label><input type="number" class="input-time" placeholder="0" oninput="calculateTotals()"></div>
                </div>
                <div class="form-group" style="margin-top:10px;">
                    <label>強度 RPE (1-10)</label>
                    <div class="range-wrap">
                        <input type="range" min="1" max="10" value="3" oninput="this.nextElementSibling.innerText = this.value">
                        <span>3</span>
                    </div>
                </div>
            </div>`;
        document.getElementById('segmentContainer').insertAdjacentHTML('beforeend', html);
    }

    function updateSegmentType(select, id) {
        const card = document.getElementById(`seg-${id}`);
        card.className = `segment-card ${workoutTypes[select.value].color || ''}`;
    }

    function removeSegment(id) {
        document.getElementById(`seg-${id}`).remove();
        calculateTotals();
    }

    function calculateTotals() {
        let d = 0, t = 0;
        document.querySelectorAll('.segment-card').forEach(c => {
            d += parseFloat(c.querySelector('.input-dist').value) || 0;
            t += parseFloat(c.querySelector('.input-time').value) || 0;
        });
        document.getElementById('totalDist').innerText = d.toFixed(2);
        document.getElementById('totalTime').innerText = t;
    }

    addSegment(); // 預設加一格




document.getElementById('trainingForm').addEventListener('submit', function(e) {
    e.preventDefault(); // 阻止網頁原本的重新整理動作

    const user = auth.currentUser;
    if (!user) {
        alert("錯誤：偵測不到使用者登入狀態，無法儲存。");
        return;
    }

    // 1. 收集「訓練分段」資料
    let segments = [];
    document.querySelectorAll('.segment-card').forEach(card => {
        segments.push({
            type: card.querySelector('select').value,
            distance: parseFloat(card.querySelector('.input-dist').value) || 0,
            time: parseFloat(card.querySelector('.input-time').value) || 0,
            rpe: parseInt(card.querySelector('input[type="range"]').value) || 0
        });
    });

    // 2. 準備要上傳的資料物件
    const workoutData = {
        userId: user.uid, // 重要！標記這筆資料是誰的
        userEmail: user.email, // 方便後台查看 (選填)
        date: document.getElementById('trainingDate').value,
        weather: document.getElementById('weather').value,
        notes: document.querySelector('textarea').value,
        segments: segments, // 這是個陣列 (Array)
        totalDistance: parseFloat(document.getElementById('totalDist').innerText),
        totalTime: parseInt(document.getElementById('totalTime').innerText),
        createdAt: firebase.firestore.FieldValue.serverTimestamp() // 紀錄寫入的精確時間
    };

    // 3. 寫入 Firestore 資料庫
    // 我們將資料存到名為 'workouts' 的集合中
    const btn = document.querySelector('.btn-submit');
    const originalText = btn.innerText;
    btn.innerText = "☁️ 資料上傳中...";
    btn.disabled = true;

    db.collection('workouts').add(workoutData)
        .then((docRef) => {
            console.log("寫入成功，文件 ID: ", docRef.id);
            alert("✅ 訓練紀錄已成功儲存到雲端！");
            window.location.href = "index.html"; // 存完跳回首頁
        })
        .catch((error) => {
            console.error("寫入錯誤: ", error);
            alert("❌ 儲存失敗: " + error.message);
            btn.innerText = originalText;
            btn.disabled = false;
        });
});



    });
</script>

</body>
</html>
